[plugin]
id = "com.0wn3df1x.bibliotekarsha"
name = "Bibliotekarsha (Beta)"
version = "0.7.0"
author = "0wn3df1x"
description = "Бета-версия плагина для библиотеки Steam: умная фильтрация по русской озвучке, субтитрам, раннему доступу, умным меткам, годам, отзывам, рейтингу, поиск русификаторов ZOG, Наблюдатель и Виртуальный режим Инкогнито."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webkit/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix = "BCK"
frontend_prefix = "FRT"
webview_prefix = "WEB"
